services:
  - type: web
    name: blog-api
    runtime: python
    buildCommand: pip install -r requirements.txt && cd backend && alembic upgrade head
    startCommand: bash start.sh
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: postgresql://neondb_owner:***@ep-raspy-shadow-a59bfei1.us-east-2.aws.neon.tech/neondb?sslmode=require
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://blog-1-wubh.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://blog-1-wubh.onrender.com
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: COOKIE_SAMESITE
        value: none
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_TO_EMAIL
        sync: false
      - key: SMTP_USE_TLS
        value: true

  - type: web
    name: blog-frontend
    runtime: node
    rootDir: frontend/my-app
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: API_URL
        value: https://blog-28ci.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://blog-28ci.onrender.com
